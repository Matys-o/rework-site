# Mise en ligne automatique : chaque push sur main → build Vite → Cloudflare Pages (projet rework-archive).
# Secret requis dans le dépôt : CLOUDFLARE_API_TOKEN (permission « Cloudflare Pages : Edit »).
name: Déploiement

on:
  push:
    branches: [main]
  # Chaque lundi 00:10 UTC : reconstruction pour le trio de la semaine (page /trios/AAAA-Wnn prérendue, sitemap à jour)
  schedule:
    - cron: "10 0 * * 1"
  workflow_dispatch:
    inputs:
      lettre:
        description: "Préparer aussi la lettre (brouillon Brevo + test)"
        type: boolean
        default: false

concurrency:
  group: deploiement
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Mise en ligne sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6df853fdd35a832bbbbd4d99464a6f14
          command: pages deploy dist --project-name rework-archive --branch main

      # Le lundi, une fois le site en ligne (images de la lettre comprises) : campagne Brevo en BROUILLON + test.
      # Jamais d'envoi à la liste : l'envoi se fait à la main depuis Brevo, après relecture.
      - name: Lettre — brouillon Brevo et test
        if: success() && (github.event_name == 'schedule' || inputs.lettre)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
        run: node scripts/lettre.mjs brouillon --a "${{ vars.LETTRE_TEST_EMAIL }}"
